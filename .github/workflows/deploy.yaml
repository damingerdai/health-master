name: Build and publish health-master

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        type: choice
        default: both
        options:
          - both
          - ghcr
          - dockerhub
      publish_latest:
        description: Also publish the latest tag
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: damingerdai/health-master
  REGISTRY: ${{ inputs.registry || 'both' }}
  PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          version=''
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a version tag in vx.y.z format: $version" >&2
              exit 1
            fi
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$REGISTRY" in
            both) registries=(ghcr.io docker.io) ;;
            ghcr) registries=(ghcr.io) ;;
            dockerhub) registries=(docker.io) ;;
            *) echo "Unsupported registry: $REGISTRY" >&2; exit 1 ;;
          esac
          {
            echo 'tags<<EOF'
            for registry in "${registries[@]}"; do
              echo "${registry}/${IMAGE_NAME}:${sha}"
              echo "${registry}/${IMAGE_NAME}:${sha:0:7}"
              if [[ -n "$version" ]]; then
                echo "${registry}/${IMAGE_NAME}:${version}"
              fi
              if [[ "$PUBLISH_LATEST" == 'true' ]]; then
                echo "${registry}/${IMAGE_NAME}:latest"
              fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.REGISTRY == 'both' || env.REGISTRY == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.REGISTRY == 'both' || env.REGISTRY == 'dockerhub'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: github.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
