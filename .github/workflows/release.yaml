name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (1.2.3 or v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  prepare-release:
    # Releases are cut from the current main branch only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and synchronize versions
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: python3 scripts/prepare-release.py "$RELEASE_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate release notes and changelog
        run: |
          npx --yes --package conventional-changelog-cli@5.0.0 \
            --package conventional-changelog-conventionalcommits@8.0.0 conventional-changelog \
            --preset conventionalcommits --pkg web/package.json --tag-prefix v --release-count 1 \
            --outfile "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').read_text()
          changelog = Path('CHANGELOG.md')
          previous = changelog.read_text() if changelog.exists() else '# Changelog\n\n'
          heading = '# Changelog\n\n'
          body = previous.removeprefix(heading)
          changelog.write_text((heading + notes.rstrip() + '\n\n' + body).rstrip() + '\n')
          PY

      - name: Save release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Commit release and push tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/version/version.go main.go docs/docs.go docs/swagger.json docs/swagger.yaml web/package.json CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}"

  publish-images:
    needs: prepare-release
    uses: ./.github/workflows/deploy.yaml
    with:
      release_tag: ${{ needs.prepare-release.outputs.tag }}
    secrets: inherit

  release:
    needs: [prepare-release, publish-images]
    runs-on: ubuntu-latest
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
