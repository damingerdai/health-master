name: Release from main

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        type: choice
        default: prerelease
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: Prerelease identifier (ignored for stable releases)
        required: true
        type: choice
        default: beta
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: write

concurrency:
  group: release-from-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Require main workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo '::error::Select main in the Run workflow branch selector.'
            exit 1
          fi

      - name: Check release token
        run: |
          if [[ -z "$RELEASE_PAT" ]]; then
            echo 'Configure the RELEASE_PAT repository secret before running this workflow.' >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test release helper
        run: node --test scripts/test-release.mjs

      - name: Prepare release version
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
          PREID: ${{ inputs.preid }}
        run: node scripts/prepare-release.mjs --increment "$INCREMENT" --preid "$PREID"

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --tag ${{ steps.version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Validate generated files
        run: |
          test -s "$RUNNER_TEMP/release-notes.md"
          test -s CHANGELOG.md
          git diff --check

      - name: Save release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Commit release and push
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/version/version.go main.go docs/docs.go docs/swagger.json docs/swagger.yaml web/package.json CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          REFS=(HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}")
          git push --atomic origin "${REFS[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ARGS=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
