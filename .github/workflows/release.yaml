name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (1.2.3 or v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-tag:
    # Tags point to the current main branch without creating a release commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A PAT allows the tag push to trigger deploy.yaml.
      - name: Check release token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [[ -z "$RELEASE_PAT" ]]; then
            echo 'Configure the RELEASE_PAT repository secret before running this workflow.' >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Validate release tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: python3 scripts/prepare-release.py --validate-only "$RELEASE_VERSION"

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
