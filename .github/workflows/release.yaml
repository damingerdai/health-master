name: Release from dev

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (only patch/minor/major promote to main)
        required: true
        type: choice
        default: prerelease
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: Prerelease identifier (ignored for stable releases)
        required: true
        type: choice
        default: beta
        options:
          - alpha
          - beta
          - rc
      registry:
        description: Registry to publish to
        type: choice
        default: both
        options:
          - both
          - ghcr
          - dockerhub

permissions:
  contents: write

concurrency:
  group: release-from-dev
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require dev workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != 'refs/heads/dev' ]]; then
            echo '::error::Select dev in the Run workflow branch selector.'
            exit 1
          fi

      - name: Check release token
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [[ -z "$RELEASE_PAT" ]]; then
            echo 'Configure the RELEASE_PAT repository secret before running this workflow.' >&2
            exit 1
          fi

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Validate release inputs and branches
        id: prepare
        env:
          INCREMENT: ${{ inputs.increment }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail
          case "$INCREMENT" in
            patch|minor|major) STABLE=true ;;
            prepatch|preminor|premajor|prerelease) STABLE=false ;;
            *) echo '::error::Unsupported version increment.'; exit 1 ;;
          esac
          case "$PREID" in
            alpha|beta|rc) ;;
            *) echo '::error::Unsupported prerelease identifier.'; exit 1 ;;
          esac
          if [[ "$STABLE" == true ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo '::error::Merge main into dev first, then retry. Production promotion must be a fast-forward.'
              exit 1
            fi
          fi
          printf 'stable=%s\n' "$STABLE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Test release helper
        run: node --test scripts/test-release.mjs

      - name: Prepare release version
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
          PREID: ${{ inputs.preid }}
        run: node scripts/prepare-release.mjs --increment "$INCREMENT" --preid "$PREID"

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          version: v2.14.2
          args: --tag ${{ steps.version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Validate generated files
        run: |
          test -s "$RUNNER_TEMP/release-notes.md"
          test -s CHANGELOG.md
          git diff --check

      - name: Save release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Commit release and promote stable version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          STABLE: ${{ steps.prepare.outputs.stable }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-*) ACTUAL_STABLE=false ;;
            *) ACTUAL_STABLE=true ;;
          esac
          if [[ "$ACTUAL_STABLE" != "$STABLE" ]]; then
            echo "::error::Generated version does not match the requested release type."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/version/version.go main.go docs/docs.go docs/swagger.json docs/swagger.yaml web/package.json CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          # Atomic, non-force push: rejection leaves every remote ref unchanged.
          REFS=(HEAD:refs/heads/dev "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}")
          if [[ "$STABLE" == true ]]; then
            REFS+=(HEAD:refs/heads/main)
          fi
          git push --atomic origin "${REFS[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ARGS=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

  publish-image:
    needs: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: damingerdai/health-master
      REGISTRY: ${{ inputs.registry }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          version="$RELEASE_TAG"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$REGISTRY" in
            both) registries=(ghcr.io docker.io) ;;
            ghcr) registries=(ghcr.io) ;;
            dockerhub) registries=(docker.io) ;;
            *) echo "Unsupported registry: $REGISTRY" >&2; exit 1 ;;
          esac
          {
            echo 'tags<<EOF'
            for registry in "${registries[@]}"; do
              echo "${registry}/${IMAGE_NAME}:${sha}"
              echo "${registry}/${IMAGE_NAME}:${sha:0:7}"
              if [[ -n "$version" ]]; then
                echo "${registry}/${IMAGE_NAME}:${version}"
              fi
              if [[ "$version" != *-* ]]; then
                echo "${registry}/${IMAGE_NAME}:latest"
              fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.REGISTRY == 'both' || env.REGISTRY == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.REGISTRY == 'both' || env.REGISTRY == 'dockerhub'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: github.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
