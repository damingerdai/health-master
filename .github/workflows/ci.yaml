name: daming health master ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY_NAME: github.com

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install, Lint And Build
        run: cd web && bun install --frozen-lockfile && bun run lint && bun run build
  end:
    runs-on: ${{ matrix.os }}
    needs: [front]
    strategy:
      fail-fast: true
      matrix:
        go-version: ["1.27.0"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: go fmt check
        run: sh scripts/gofmtcheck.sh
      - name: build
        run: go build -o main main.go
  build-front-docker:
    runs-on: ubuntu-latest
    needs: [front]
    steps:
      - uses: actions/checkout@v7
      - name: Build docker
        id: build-docker-web
        run: |
          cd web && docker build . -t ${{ env.REGISTRY_NAME }}/damingerdai/health-master-web:${{ github.sha }} -f Dockerfile
      - name: Image digest
        run: echo ${{ steps.build-docker-web.outputs.digest }}
  build-end-docker:
    runs-on: ubuntu-latest
    needs: [end]
    steps:
      - uses: actions/checkout@v7
      - name: Build docker
        id: build-docker
        run: |
          docker build . -t ${{ env.REGISTRY_NAME }}/damingerdai/health-master:${{ github.sha }} -f Dockerfile
      - name: Image digest
        run: echo ${{ steps.build-docker.outputs.digest }}
