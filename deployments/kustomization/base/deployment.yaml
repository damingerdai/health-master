apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-master-api
  labels:
    app: health-master-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: health-master-api

  template:
    metadata:
      labels:
        app: health-master-api

    spec:
      containers:
        - name: health-master-api
          image: health-master:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: health-master-config