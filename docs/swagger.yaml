    type: object
  model.RequestResetInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  model.ResetPasswordSubmitInput:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - password
    type: object
  model.Role:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Setup2FaResult:
    properties:
      enabled:
        type: boolean
      qr_code:
        type: string
      secret:
        type: string
    type: object
  model.StatisticsSummary:
    properties:
      bloodPressureTrend:
        items:
          $ref: '#/definitions/model.UserBloodPressure'
        type: array
      latestBloodPressure:
        $ref: '#/definitions/model.UserBloodPressure'
      latestHeight:
        $ref: '#/definitions/model.UserHeightVO'
      latestTemperature:
        $ref: '#/definitions/model.UserTemperatureRecord'
      latestWeight:
        $ref: '#/definitions/model.WeightRecord'
      temperatureTrend:
        items:
          $ref: '#/definitions/model.UserTemperature'
        type: array
      weightTrend:
        items:
          $ref: '#/definitions/model.WeightRecord'
        type: array
    type: object
  model.UpdateTwoFactorRequest:
    properties:
      code:
        type: string
      enabled:
        type: boolean
    required:
    - code
    type: object
  model.User:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      gender:
        type: string
      id:
        type: string
      lastName:
        type: string
      password:
        type: string
      two_factor_enabled:
        type: boolean
      two_factor_verified_at:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    required:
    - firstName
    - gender
    - lastName
    - password
    - username
    type: object
  model.UserBloodPressure:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      diastolicBloodPressure:
        type: integer
      id:
        type: string
      logDatetime:
        type: string
      pulse:
        type: integer
      systolicBloodPressure:
        type: integer
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/model.User'
      userId:
        type: string
    type: object
  model.UserHeight:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      height:
        type: number
      id:
        type: string
      recordDate:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    required:
    - userId
    type: object
  model.UserHeightVO:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      height:
        type: number
      id:
        type: string
      recordDate:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/model.User'
      userId:
        type: string
    required:
    - userId
    type: object
  model.UserTemperature:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      notes:
        type: string
      recordDate:
        type: string
      temperature:
        type: number
      unit:
        description: e.g. "C" or "F"
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/model.User'
