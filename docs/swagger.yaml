  model.ErrorResponseSwagger:
    properties:
      code:
        example: 10000001
        type: integer
      details:
        items:
          type: string
        type: array
      message:
        example: Invalid Parameters
        type: string
    type: object
  model.ListResponse-model_UserBloodPressure:
    properties:
      count:
        type: integer
      data:
        items:
          $ref: '#/definitions/model.UserBloodPressure'
        type: array
    type: object
  model.ListResponse-model_UserHeightVO:
    properties:
      count:
        type: integer
      data:
        items:
          $ref: '#/definitions/model.UserHeightVO'
        type: array
    type: object
  model.ListResponse-model_WeightRecordVO:
    properties:
      count:
        type: integer
      data:
        items:
          $ref: '#/definitions/model.WeightRecordVO'
        type: array
    type: object
  model.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
