        type: string
    type: object
  model.UserTemperatureRecord:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      notes:
        type: string
      recordDate:
        type: string
      temperature:
        type: number
      unit:
        description: e.g. "C" or "F"
        type: string
      updatedAt:
        type: string
