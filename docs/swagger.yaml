  model.ChangePasswordInput:
    properties:
      current_password:
        description: Current password, at least 8 characters.
        minLength: 8
        type: string
      new_password:
        description: New password, at least 8 characters.
        minLength: 8
        type: string
      two_factor_code:
        description: Six-digit TOTP code; required when 2FA is enabled.
        type: string
