info:
  contact: {}
  description: health master open api
  termsOfService: http://swagger.io/terms/
  title: health master api
  version: "0.0.3-alpha.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password. If 2FA is enabled, a challenge token
        will be returned.
      parameters:
      - description: login request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/model.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errcode.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: User login
      tags:
      - auth
  /api/v1/auth/login/2fa:
    post:
      consumes:
      - application/json
      description: Complete login using a challenge token and TOTP verification code.
      parameters:
      - description: Verify Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.VerifyLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.UserToken'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: Verify Two-Factor Authentication
      tags:
      - auth
  /api/v1/height:
    post:
      consumes:
      - application/json
      description: create a new record for user height
      parameters:
      - description: create a user height record
        in: body
        name: user_height
        required: true
        schema:
          $ref: '#/definitions/model.UserHeight'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.UserHeightVO'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: create a user height record
      tags:
      - user_height
  /api/v1/heights:
    get:
      consumes:
      - application/json
      description: get paginated height records for a user. If userId is not provided,
        the user is resolved from the access token.
      parameters:
      - description: User ID
        in: query
        name: userId
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 5
        description: Number of records per page
        in: query
        name: limit
        type: integer
      - description: Access token (alternative to Authorization header)
        in: query
        name: accessToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.ListResponse-model_UserHeightVO'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: list user height records
      tags:
      - user_height
  /api/v1/password-resets:
    post:
      consumes:
      - application/json
      description: send a password reset link to the user's email
      parameters:
      - description: email address
        in: body
        name: RequestResetInput
        required: true
        schema:
          $ref: '#/definitions/model.RequestResetInput'
      produces:
      - application/json
      responses:
        "200":
          description: password reset link sent
          schema:
            $ref: '#/definitions/errcode.Error'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: create a password reset request
      tags:
      - password-reset
  /api/v1/password-resets/{token}:
    get:
      consumes:
      - application/json
      description: verify the validity of a password reset token
      parameters:
      - description: password reset token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: masked email
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid or expired token
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: verify password reset token
      tags:
      - password-reset
    put:
      consumes:
      - application/json
      description: reset user password with a valid password reset token
      parameters:
      - description: password reset token
        in: path
        name: token
        required: true
        type: string
      - description: new password and confirmation
        in: body
        name: ResetPasswordSubmitInput
        required: true
        schema:
          $ref: '#/definitions/model.ResetPasswordSubmitInput'
      produces:
      - application/json
      responses:
        "200":
          description: password reset successfully
          schema:
            $ref: '#/definitions/errcode.Error'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: reset password
      tags:
      - password-reset
  /api/v1/roles:
    get:
      consumes:
      - application/json
      description: get all roles
      produces:
      - application/json
      responses:
        "200":
          description: sucess
          schema:
            items:
              $ref: '#/definitions/model.Role'
            type: array
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: get all roles
      tags:
      - roles
  /api/v1/settings/2fa:
    get:
      consumes:
      - application/json
      description: Get the current 2FA status. If 2FA is not enabled, an otpauth URL
        will be generated for enrollment.
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.Setup2FaResult'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: Get Two-Factor Authentication setup
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: Enable or disable TOTP-based two-factor authentication for the
        current user. A valid verification code is required.
      parameters:
      - description: Update Two-Factor Authentication
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTwoFactorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: bad request
          schema:
            $ref: '#/definitions/errcode.Error'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: Enable or disable Two-Factor Authentication
      tags:
      - settings
  /api/v1/settings/password:
    put:
      consumes:
      - application/json
      description: |-
        Change the authenticated user's password using the current password. A six-digit TOTP code is required when 2FA is enabled.
        Limited to 5 requests per user per minute. Five password or TOTP verification failures within 15 minutes trigger a 15-minute lockout. Successful changes reset the failure count.
      parameters:
      - description: Password change request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or TOTP code
          schema:
            $ref: '#/definitions/errcode.Error'
        "401":
          description: Authentication required, invalid current password, or missing
            required TOTP code
          schema:
            $ref: '#/definitions/errcode.Error'
        "429":
          description: Request limit exceeded or temporarily locked out
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed
              type: string
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - settings
  /api/v1/statistics/summary:
    get:
      consumes:
      - application/json
      description: Get statistics summary for the current user
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.StatisticsSummary'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: Get statistics summary
      tags:
      - statistics
  /api/v1/tmptoken:
    post:
      consumes:
      - application/json
      description: get a temporary token (1 minute expiry)
      parameters:
      - description: access token
        in: query
        name: accessToken
        type: string
      - default: Bearer <Add access token here>
        description: Authorization token
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.UserToken'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: get tmp token
      tags:
      - token
  /api/v1/token:
    get:
      consumes:
      - application/json
      description: parse a exsited token
      parameters:
      - default: Bearer <Add access token here>
        description: Insert your access token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: sucess
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: parse a token
      tags:
      - token
    post:
      consumes:
      - application/json
      description: Create an access token using email, password, and a TOTP code when
        2FA is enabled.
      parameters:
      - description: email
        in: header
        name: email
        required: true
        type: string
      - description: password
        in: header
        name: password
        required: true
        type: string
      - description: TOTP code; required when 2FA is enabled
        in: header
        name: two_factor_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.UserToken'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      summary: create a token
      tags:
      - token
  /api/v1/user:
    post:
      consumes:
      - application/json
      description: create a new user
      parameters:
      - description: create a user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: sucess
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: create a user
      tags:
      - user
    put:
      consumes:
      - application/json
      description: update user details
      parameters:
      - description: update user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.User'
      produces:
      - application/json
      responses:
        "200":
          description: sucess
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/errcode.Error'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/errcode.Error'
      security:
      - BearerAuth: []
      summary: update user
      tags:
      - user
  /api/v1/user-blood-pressure:
    post:
      consumes:
      - application/json
      description: create a user blood pressure
      parameters:
      - description: create a user blood pressure
        in: body
        name: user_blood_pressure
        required: true
        schema:
          $ref: '#/definitions/model.UserBloodPressure'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.APIResponseSwagger-model_UserBloodPressure'
        "400":
          description: bad request error
          schema:
            $ref: '#/definitions/model.ErrorResponseSwagger'
        "401":
          description: invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponseSwagger'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponseSwagger'
      security:
      - BearerAuth: []
      summary: create a user blood pressure
      tags:
      - user_blood_pressure
  /api/v1/user-blood-pressure/{id}:
    delete:
      description: delete a user blood pressure record
      parameters:
      - description: user blood pressure id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            $ref: '#/definitions/model.APIResponseSwagger-model_BloodPressureDeleteResultSwagger'
        "401":
          description: invalid or expired access token
          schema:
            $ref: '#/definitions/model.ErrorResponseSwagger'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/model.ErrorResponseSwagger'
      security:
      - BearerAuth: []
      summary: delete a user blood pressure record
      tags:
      - user_blood_pressure
  /api/v1/user-blood-pressure/{id}/export:
    get:
      description: download user blood pressure excel
      parameters:
      - description: User ID whose blood pressure records will be exported
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      - application/json
      responses:
        "200":
          description: excel file
          schema:
