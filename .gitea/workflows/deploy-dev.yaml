name: Deploy to Dev

on:
  workflow_dispatch:

env:
  REGISTRY: 192.168.31.220:5000

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write buildkitd config for insecure HTTP registry
        run: |
          mkdir -p /tmp/buildx
          printf '[registry."%s"]\n  http = true\n  insecure = true\n' "${{ env.REGISTRY }}" > /tmp/buildx/buildkitd.toml
          cat /tmp/buildx/buildkitd.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          config: /tmp/buildx/buildkitd.toml

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push health-master (backend)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/health-master:latest
            ${{ env.REGISTRY }}/health-master:${{ steps.vars.outputs.sha7 }}

      - name: Build and push health-master-web (frontend)
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/health-master-web:latest
            ${{ env.REGISTRY }}/health-master-web:${{ steps.vars.outputs.sha7 }}
